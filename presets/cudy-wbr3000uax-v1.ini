; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Cudy WBR3000UAX v1
description=5x1G MT7531 (WAN = port 0), DDR3 256 MB, NAND 128 MB, USB 3.0
gmac0=mt7531
ports=wan:lan1:lan2:lan3:lan4
gmac1=none
nand=128
ddr=ddr3
ram=256
usb-port=3
reset-gpio=1
wps-gpio=0
nand-dir=nand-wbr3000uax
openwrt=cudy_wbr3000uax-v1

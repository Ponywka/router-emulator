; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
[preset]
name=Cudy WR3000H v1
description=2.5G WAN RTL8221B (reset on the MDIO bus), 4x1G LAN MT7531, DDR3 512 MB, NAND 128 MB, no USB
gmac0=mt7531
ports=lan4:lan3:lan2:lan1:-
gmac1=rtl8221b
gmac1-port=wan
gmac1-reset-gpio=3
nand=128
ddr=ddr3
ram=512
usb-port=none
reset-gpio=1
wps-gpio=0
nand-dir=nand-wr3000h
openwrt=cudy_wr3000h-v1
